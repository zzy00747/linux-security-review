/* === ExamPass Shared Styles === */
/* Paper-like warm background, clean typography, responsive */

:root {
  --paper: #fdf6e3;
  --paper-dark: #f5ecd7;
  --ink: #2c2c2c;
  --ink-light: #555;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --divider: #d6c8a8;
  --card-bg: #fef9ef;
  --card-border: #e8dcc8;
  --correct: #22c55e;
  --correct-bg: #f0fdf4;
  --wrong: #ef4444;
  --wrong-bg: #fef2f2;
  --tag-bg: #fef3c7;
  --tag-text: #92400e;
  --radius: 6px;
}

* { box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", "Noto Sans SC", "SimSun", sans-serif;
  font-size: 12pt; line-height: 1.75; color: var(--ink);
  max-width: 860px; margin: auto; padding: 24px 20px 60px;
  background: var(--paper);
}

@media print {
  body { font-size: 10.5pt; background: #fff; }
  .no-print { display: none !important; }
  h1, h2, h3 { page-break-after: avoid; }
}

/* ── Header ── */
#exampass-header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0; margin-bottom: 0;
}
.header-brand { font-size: 1.2em; font-weight: 700; color: #1a1a2e; letter-spacing: 0.3px; }
.header-url  { font-size: 0.78em; color: #999; }
.header-divider { border: none; border-top: 2px solid var(--divider); margin: 4px 0 20px 0; }

/* ── Typography ── */
h1 { font-size: 1.55em; text-align: center; border-bottom: 2px solid var(--divider); padding-bottom: 8px; margin-top: 0; }
h2 { font-size: 1.25em; border-bottom: 1px solid var(--divider); padding-bottom: 4px; margin-top: 28px; }
h3 { font-size: 1.08em; margin-top: 20px; color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Tables ── */
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.95em; }
td, th { border: 1px solid var(--card-border); padding: 5px 9px; text-align: left; }
th { background: var(--paper-dark); font-weight: 700; }

/* ── Knowledge point vs explanation ── */
.kp { font-weight: 700; color: var(--ink); }           /* key point: bold dark */
.exp { font-weight: 400; color: var(--ink-light); }    /* explanation: lighter */
.exp em, .exp strong { color: var(--ink); }             /* emphasis inside explanation */

/* ── Block elements ── */
blockquote {
  border-left: 3px solid #c0392b; background: #fef9ef;
  padding: 6px 14px; margin: 10px 0; font-size: 0.95em;
}
/* Modern monospace stack — avoids the ugly Courier New fallback on Windows. */
:root {
  --mono: "Cascadia Code", "JetBrains Mono", "Fira Code", "Source Code Pro",
          Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
}
code {
  font-family: var(--mono);
  background: #eee8d8; color: #8a4b1e;
  padding: 1px 5px; border-radius: 4px; font-size: 0.9em;
}
pre {
  font-family: var(--mono);
  background: #2d2a26; color: #ece6da;
  padding: 14px 16px; border-radius: var(--radius);
  overflow-x: auto; line-height: 1.6; font-size: 0.9em;
  border: 1px solid #3d3934; tab-size: 2;
}
pre code {
  background: none; color: inherit; padding: 0; font-size: 1em; border-radius: 0;
}
/* kp/exp spans inside <pre> must inherit the light code color, not their own dark color */
pre .kp, pre .exp { color: inherit; }

/* ── Long display formulas: scroll inside their column, never overflow ── */
mjx-container[display="true"] {
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

/* ── TOC ── */
div.toc {
  background: var(--card-bg); padding: 14px 18px;
  border: 1px solid var(--card-border); border-radius: var(--radius); margin-bottom: 22px;
}
div.toc ul { padding-left: 18px; }
div.toc li { margin: 3px 0; font-size: 0.95em; }

/* ── Priority tags ── */
.tag-must   { background: #fee2e2; color: #991b1b; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-key    { background: #fef3c7; color: #92400e; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-freq   { background: #dbeafe; color: #1e40af; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }
.tag-info   { background: #f0fdf4; color: #166534; padding: 1px 6px; border-radius: 3px; font-size: 0.82em; font-weight: 600; }

/* ── Checkpoint self-test ── */
.checkpoint {
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius);
  padding: 10px 16px; margin: 18px 0;
  font-size: 0.95em;
}
.checkpoint::before {
  content: '🧠 自测：';
  font-weight: 700; color: #1e40af;
}
.checkpoint .cp-answer { margin-top: 10px; border-top: 1px dashed #bfdbfe; padding-top: 8px; }
.checkpoint .cp-answer summary {
  cursor: pointer; color: #1e40af; font-weight: 600; user-select: none;
  list-style: none;
}
.checkpoint .cp-answer summary::before { content: '💡 '; }
.checkpoint .cp-answer summary::-webkit-details-marker { display: none; }
.checkpoint .cp-answer[open] summary { margin-bottom: 6px; }
.checkpoint .cp-answer ol, .checkpoint .cp-answer p { font-weight: 400; color: var(--ink); }

/* ── TL;DR summary ── */
.tldr {
  background: #fefce8; border-left: 3px solid #eab308;
  padding: 8px 14px; margin: 10px 0;
  font-weight: 600; font-size: 0.95em;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  body { max-width: 100%; padding: 12px 10px 40px; font-size: 11pt; }
  h1 { font-size: 1.3em; }
  h2 { font-size: 1.12em; }
  table { font-size: 0.85em; }
  td, th { padding: 4px 6px; }
  pre { font-size: 0.85em; padding: 6px; }
}
@media (max-width: 400px) {
  body { padding: 8px 6px 32px; font-size: 10.5pt; }
}

/* === Interactive Test Styles === */

/* ── Score box ── */
#score-box {
  display: none; background: var(--paper-dark); color: var(--ink);
  padding: 16px 20px; border-radius: var(--radius); margin: 14px 0;
  text-align: center; border: 1px solid var(--card-border);
}
#score-box .score-num { font-size: 2.2em; font-weight: 700; }
#score-box .score-label { font-size: 0.85em; color: var(--ink-light); }

/* ── Question card ── */
.q-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 12px 14px; margin: 10px 0;
  transition: all 0.15s;
}
.q-card.correct { border-left: 3px solid var(--correct); background: #f7fdf4; }
.q-card.wrong   { border-left: 3px solid var(--wrong); background: #fef9f9; }

.q-num  { font-weight: 700; font-size: 0.98em; margin-bottom: 4px; }
.q-text { margin-bottom: 8px; font-size: 0.98em; }

/* ── Options (compact) ── */
.option {
  display: block; padding: 4px 10px; margin: 3px 0;
  border: 1px solid var(--card-border); border-radius: 4px;
  cursor: pointer; transition: all 0.12s; font-size: 0.93em;
  background: #fefcf5;
}
.option:hover            { background: #f0ede0; }
.option input            { margin-right: 6px; }
.option.selected         { border-color: var(--accent); background: #eff6ff; }
.option.correct-answer   { border-color: var(--correct); background: var(--correct-bg); }
.option.wrong-answer     { border-color: var(--wrong); background: var(--wrong-bg); }

/* ── Textareas (compact) ── */
.q-textarea {
  width: 100%; min-height: 56px; border: 1px solid var(--card-border);
  border-radius: 4px; padding: 6px 10px; font-family: inherit;
  font-size: 0.93em; background: #fefcf5; resize: vertical;
}
.q-textarea:focus { outline: none; border-color: var(--accent); }
.q-code {
  font-family: "Consolas", "Monaco", "Courier New", monospace;
  font-size: 0.88em; line-height: 1.5; background: #1e1e2e; color: #e0e0e0;
  tab-size: 4; white-space: pre;
}
.q-code:focus { border-color: var(--accent); }

/* ── Partial-credit badge ── */
.badge-partial { background: #fef3c7; color: #92400e; }
.q-card.partial { border-color: #f59e0b; }

/* ── Result after grading ── */
.result {
  display: none; margin-top: 8px; padding: 8px 12px;
  background: #fefcf5; border: 1px solid var(--card-border);
  border-radius: 4px; font-size: 0.9em; line-height: 1.6;
}
.result .badge {
  display: inline-block; padding: 1px 9px; border-radius: 3px;
  font-weight: 700; font-size: 0.82em; margin-right: 6px;
}
.badge-ok  { background: var(--correct-bg); color: #166534; }
.badge-no  { background: var(--wrong-bg); color: #991b1b; }
.badge-ref { background: #dbeafe; color: #1e40af; }

.result .explanation { margin-top: 4px; color: var(--ink); }
.result .pitfall { color: #b45309; margin-top: 3px; font-size: 0.9em; }

/* ── Grading button ── */
.grading-bar { text-align: center; margin: 20px 0; }
.grading-bar button {
  font-size: 1em; padding: 8px 32px; background: var(--accent);
  color: #fff; border: none; border-radius: var(--radius);
  cursor: pointer; font-weight: 600; letter-spacing: 0.3px;
}
.grading-bar button:hover     { background: var(--accent-hover); }
.grading-bar button:disabled  { background: #bbb; cursor: not-allowed; }

/* ── Fill-in-blank inputs ── */
.fill-input {
  border: 1px solid var(--card-border); border-radius: 3px;
  padding: 2px 8px; font-family: inherit; font-size: 0.95em;
  background: #fefcf5; width: 140px; vertical-align: middle;
  transition: border-color .12s;
}
.fill-input:focus { outline: none; border-color: var(--accent); }
.fill-input.fill-ok { border-color: var(--correct); background: var(--correct-bg); }
.fill-input.fill-no { border-color: var(--wrong); background: var(--wrong-bg); }
/* stacked blanks (fill questions whose blank markers aren't in the text) */
.fill-blank-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.fill-blank-row .fill-input { flex: 1; min-width: 0; width: auto; }
.fill-tag { font-weight: 600; font-size: 0.9em; color: var(--ink-light); white-space: nowrap; }

/* ── Pasted image preview ── */
.paste-img-wrap {
  margin-top: 6px; position: relative; display: inline-block; max-width: 100%;
}
.paste-img-wrap img {
  max-width: 100%; max-height: 240px; border-radius: 4px;
  border: 1px solid var(--divider); display: block;
}
.paste-img-remove {
  position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%;
  cursor: pointer; font-size: 12px; line-height: 20px; text-align: center; padding: 0;
}

/* ── AI批改 save-for-grading button ── */
.save-bar { text-align: center; margin: 10px 0 4px; }
.save-bar button {
  font-size: 0.95em; padding: 7px 22px; background: #7c5ccc;
  color: #fff; border: none; border-radius: var(--radius);
  cursor: pointer; font-weight: 600;
}
.save-bar button:hover { background: #6748b4; }

/* ── Grade export modal ── */
#epa-grade-modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.62);
  z-index: 9998; align-items: center; justify-content: center;
}
#epa-grade-modal.open { display: flex; }
.epa-grade-dialog {
  background: #fff; border-radius: 10px; padding: 24px 28px; max-width: 560px;
  width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.22);
}
.epa-grade-dialog h3 { margin: 0 0 10px; font-size: 1.1em; }
.epa-grade-dialog p {
  color: var(--ink-light); font-size: 0.93em; margin: 0 0 12px; line-height: 1.6;
}
.epa-grade-cmd {
  background: #1e1e2e; color: #e0e0e0; border-radius: 6px; padding: 10px 14px;
  font-family: "Consolas","Monaco","Courier New",monospace; font-size: 0.88em;
  word-break: break-all; margin-bottom: 12px; user-select: all; white-space: pre-wrap;
}
.epa-grade-dialog-btns { display: flex; gap: 10px; justify-content: flex-end; }
.epa-grade-dialog-btns button {
  padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer;
  font-size: 0.93em; font-weight: 600;
}
.btn-copy { background: var(--accent); color: #fff; }
.btn-copy:hover { background: var(--accent-hover); }
.btn-close-modal { background: #e5e5e5; color: var(--ink); }
.btn-close-modal:hover { background: #d5d5d5; }

</style>
</head>

<script>
var Q = [{"type": "choice", "points": 2, "kc_id": "kc1.5", "cognitive_level": "understand", "difficulty": "basic", "question": "在 32 位 x86 架构中，下列关于寄存器的叙述正确的是：", "options": ["CS、DS、ES、SS 属于通用寄存器，可直接参与算术运算", "EIP 保存当前正在执行指令的地址，执行完该指令后保持不变", "ESP 始终指向栈顶，EBP 通常指向当前函数栈框架的基址", "EAX 专用于存放栈基址，不能被用作通用数据运算"], "answer": 2, "explanation": "ESP（Extended Stack Pointer）始终指向当前栈顶，随 push/pop 动态变化；EBP（Extended Base Pointer）在函数入口由 movl %esp,%ebp 设定后固定，用于稳定访问参数与局部变量。认为 EIP 执行后不变的学生忽略了 EIP 每执行一条指令即自动递增这一基本事实；认为 EAX 专存栈基址的学生把通用寄存器与 EBP 的职责搞混；认为 CS/DS/ES/SS 可参与算术运算的学生混淆了段寄存器与通用寄存器——段寄存器存放段选择子，不能直接做算术。", "pitfall": "ESP 指栈顶（动态）、EBP 指栈基（函数内固定）、EIP 指指令地址（自动递增）。段寄存器不参与算术运算。"}, {"type": "choice", "points": 2, "kc_id": "kc6.6", "cognitive_level": "apply", "difficulty": "medium", "question": "把源文件 hello.c 编译为可执行文件需经四个阶段，下列命令与产物对应关系正确的是：", "options": ["gcc -S hello.i -o hello.s，产物是汇编语言源文件", "gcc -c hello.s -o hello.o，产物是已完成重定位的可执行文件", "gcc hello.o -o hello，产物是可重定位目标文件", "gcc -E hello.c -o hello.i，产物是可直接运行的机器码文件"], "answer": 0, "explanation": "gcc -S 把预处理后的 .i 文件翻译成汇编语言，产物是 .s 汇编源文件。认为 -E 产物可直接运行的学生把预处理（仅做宏展开与文件插入）当成了编译；认为 -c 产物是已完成重定位的可执行文件的学生混淆了可重定位目标文件与可执行文件——重定位发生在链接阶段；认为链接产物是可重定位文件的学生把四个阶段的方向完全颠倒了。", "pitfall": "-E→.i（预处理）、-S→.s（编译）、-c→.o（汇编）、链接→可执行文件。四步不可混淆。"}, {"type": "choice", "points": 2, "kc_id": "kc7.6", "cognitive_level": "understand", "difficulty": "medium", "question": "iptables 的 filter 表可作用于 INPUT、FORWARD、OUTPUT 三条链，这三条链的区分依据是：", "options": ["按数据包使用的传输层协议区分，TCP 走 INPUT、UDP 走 FORWARD、ICMP 走 OUTPUT", "按数据包的去向区分：送入本机进程走 INPUT、需转发给其他主机走 FORWARD、本机进程发出走 OUTPUT", "按数据包的源地址区分，内网地址走 INPUT、外网地址走 FORWARD、回环地址走 OUTPUT", "按规则的动作区分，ACCEPT 规则进 INPUT、DROP 规则进 FORWARD、REJECT 规则进 OUTPUT"], "answer": 1, "explanation": "三条链的本质区别是数据包的去向：目的地是本机则经 INPUT 链交本机进程；目的地是其他主机且需本机转发则经 FORWARD 链；本机进程自己发出的数据包经 OUTPUT 链。认为按协议区分的学生把链与协议绑定，而 iptables 的链与协议无关，协议匹配靠 -p 参数；认为按源地址区分的学生混淆了链与匹配条件；认为按动作区分的学生更是把规则动作与挂载位置混为一谈。", "pitfall": "链看「包去哪」，不看「包是什么协议」或「什么地址」。协议和地址是 -p、-s、-d 匹配条件。"}, {"type": "choice", "points": 2, "kc_id": "kc8.4", "cognitive_level": "understand", "difficulty": "basic", "question": "/etc/passwd 文件中一行内容为 operator:x:11:0:operator:/root:/sbin/nologin，其中 /sbin/nologin 表示：", "options": ["该用户的密码存放在 /sbin/nologin 文件中", "该用户只能通过 su 命令切换，不能直接登录", "该用户登录后会被自动切换到 /sbin 目录", "该用户被禁止登录系统，通常用于运行服务的系统账号"], "answer": 3, "explanation": "/etc/passwd 第七个字段是登录 Shell。/sbin/nologin 是一个特殊的「假 Shell」，用户即使通过认证也会立即被退出，从而实现禁止登录。这类账号通常用于运行系统服务（如 bin、daemon、operator），只为满足进程的属主身份需要而存在。认为登录后切目录的学生把 Shell 路径误解为工作目录；认为密码存该文件的学生混淆了 Shell 字段与密码字段（密码在 /etc/shadow）；认为只能 su 切换的学生忽略了 nologin 对 su 同样生效。", "pitfall": "/sbin/nologin 和 /bin/false 都是「禁止登录」的标志，不是目录、不是密码文件。"}, {"type": "choice", "points": 2, "kc_id": "kc9.3", "cognitive_level": "apply", "difficulty": "medium", "question": "某文件的权限串为 rwxr-xr--，其对应的八进制数字权限是：", "options": ["754", "744", "764", "755"], "answer": 0, "explanation": "逐段换算：属主 rwx = 4+2+1 = 7；组 r-x = 4+0+1 = 5；其他 r-- = 4+0+0 = 4。故为 754。选 755 的学生把其他用户的 r-- 误算成 r-x（多给了执行位）；选 744 的学生把组的 r-x 误算成 r--（漏掉执行位）；选 764 的学生把组的 r-x 误算成 rw-（把执行位当成了写位）。", "pitfall": "r=4、w=2、x=1，逐段相加。r-x 是 5 不是 6（6 是 rw-）。"}, {"type": "fill", "points": 1, "kc_id": "kc1.5", "cognitive_level": "remember", "difficulty": "basic", "question": "在 32 位 x86 中，专门用于指向当前栈顶的寄存器缩写是 ____（全大写）。", "answer": ["ESP", "esp", "%esp"], "explanation": "ESP 指向当前栈顶。push 操作先将 ESP 减 4 再写入数据，pop 操作先读出数据再将 ESP 加 4。与之配合的 EBP 指向栈基址，用于在函数内部稳定访问参数与局部变量。", "pitfall": "ESP 是栈顶指针（动态），EBP 是栈基指针（函数内固定）。"}, {"type": "fill", "points": 1, "kc_id": "kc6.4", "cognitive_level": "apply", "difficulty": "medium", "question": "要查看 ELF 文件的程序头表（Program Header Table，即段表）信息，应使用 readelf 的 ____ 选项（写选项，如 -h）。", "answer": ["-l", "-l ", "—l"], "explanation": "readelf -l 显示程序头表（段表），描述各段如何映射到内存。对照记忆：-h 显示 ELF 文件头、-S 显示节头表、-s 显示符号表、-r 显示重定位信息、-a 等价于全选。注意 -l 是小写字母 L。", "pitfall": "-l 看段表（程序头）、-S 看节头表、-s 看符号表。大小写敏感。"}, {"type": "fill", "points": 1, "kc_id": "kc6.7", "cognitive_level": "understand", "difficulty": "medium", "question": "C 程序中未初始化的全局变量存放在 ____ 节，该节在可执行文件中不占实际空间（填写节名，带点号）。", "answer": [".bss", "bss", ".BSS"], "explanation": ".bss（Block Started by Symbol）存放未初始化的全局变量与静态变量，属于静态内存分配。因其初值恒为 0，无需在文件中保存实际数据，只记录所需空间大小，section type 为 SHT_NOBITS。", "pitfall": ".bss 不占文件空间但占内存空间；.data 才是已初始化变量。"}, {"type": "fill", "points": 1, "kc_id": "kc6.12", "cognitive_level": "understand", "difficulty": "medium", "question": "fork() 系统调用在父进程中返回 ____（填「子进程的PID」或「0」或「-1」）。", "answer": ["子进程的PID", "子进程PID", "子进程的pid", "子进程的 PID", ">0", "大于0"], "explanation": "fork() 调用一次返回两次：父进程中返回新创建子进程的 PID（大于 0），子进程中返回 0，创建失败返回 -1。这是父子进程区分自身身份的唯一依据。", "pitfall": "父得子 PID（>0）、子得 0、错得 -1。判断分支千万别写反。"}, {"type": "fill", "points": 1, "kc_id": "kc7.6", "cognitive_level": "remember", "difficulty": "basic", "question": "iptables 的四张表分别是 filter、nat、mangle 和 ____（填表名）。", "answer": ["raw", "RAW", "Raw"], "explanation": "四表：filter（过滤）、nat（地址转换）、mangle（修改数据包内容）、raw（连接跟踪前处理）。五链：PREROUTING、INPUT、FORWARD、OUTPUT、POSTROUTING。", "pitfall": "四表是 filter/nat/mangle/raw；五链是 PREROUTING/INPUT/FORWARD/OUTPUT/POSTROUTING。别把表名与链名混。"}, {"type": "fill", "points": 1, "kc_id": "kc7.7", "cognitive_level": "apply", "difficulty": "medium", "question": "禁止源地址为 192.168.100.20 的数据包进入本机，命令为：iptables -A INPUT -s 192.168.100.20 -j ____（填动作名）。", "answer": ["DROP", "drop", "REJECT", "reject"], "explanation": "iptables -A INPUT -s 192.168.100.20 -j DROP 表示在 INPUT 链末尾追加规则，匹配该源地址的数据包直接丢弃。也可用 REJECT，区别是 REJECT 会向源端返回不可达响应，DROP 静默丢弃。安全场景优先 DROP，避免响应报文暴露主机存活。", "pitfall": "DROP 静默丢弃、REJECT 返回响应。安全场景优先 DROP。"}, {"type": "fill", "points": 1, "kc_id": "kc8.4", "cognitive_level": "remember", "difficulty": "basic", "question": "/etc/passwd 文件每一行由 ____ 个字段组成，字段之间用冒号分隔（填阿拉伯数字）。", "answer": ["7", "七"], "explanation": "七个字段依次为：用户名、密码占位符、UID、GID、描述信息、主目录、登录 Shell。例如 root:x:0:0:root:/root:/bin/bash。", "pitfall": "passwd 是 7 字段，shadow 是 9 字段。"}, {"type": "fill", "points": 1, "kc_id": "kc8.5", "cognitive_level": "understand", "difficulty": "medium", "question": "/etc/shadow 中密码字段以 <code>&#36;6&#36;</code> 开头，表示使用 ____ 算法加密（填算法名称）。", "answer": ["SHA-512", "sha512", "SHA512", "sha-512"], "explanation": "<code>&#36;1&#36;</code> 表示 MD5，<code>&#36;5&#36;</code> 表示 SHA-256，<code>&#36;6&#36;</code> 表示 SHA-512。算法标识之后的下一段是<strong>盐值</strong>（salt，防止彩虹表攻击），再往后是密码的哈希值。SHA-512 输出 512 位摘要，抗暴力破解能力远强于 MD5。", "pitfall": "$1$=MD5、$5$=SHA-256、$6$=SHA-512，编号越大越安全。"}, {"type": "fill", "points": 1, "kc_id": "kc9.2", "cognitive_level": "understand", "difficulty": "medium", "question": "Linux 中查看文件 inode 号、权限、属主、大小等元信息，应使用的命令是 ____（填命令名，不含参数）。", "answer": ["stat", "ls -l", "ls -i", "ls"], "explanation": "stat 命令显示文件的完整元信息，包括 inode 号、权限、硬链接数、UID/GID、大小、三个时间戳（atime/mtime/ctime）等。若只需 inode 号，也可用 ls -i。", "pitfall": "stat 看完整元信息，ls -i 只看 inode 号，ls -l 不含 inode。"}, {"type": "fill", "points": 1, "kc_id": "kc10.4", "cognitive_level": "apply", "difficulty": "medium", "question": "使用 nmap 对 192.168.1.0/24 只做主机发现、不做端口扫描，应使用的选项是 ____（写选项，如 -sV）。", "answer": ["-sn", "-sn ", "-sP"], "explanation": "nmap -sn 192.168.1.0/24 只做主机发现（ping 扫描），通过 ICMP echo、TCP SYN 到 443、TCP ACK 到 80、ARP 等多种手段判断主机是否在线，不扫描端口。旧版本写作 -sP。", "pitfall": "-sn 只探活、-sV 探服务版本、-sS 是 SYN 半开扫描。"}, {"type": "tf", "points": 1, "kc_id": "kc1.2", "cognitive_level": "understand", "difficulty": "basic", "question": "冯·诺依曼体系结构的核心特征是「存储程序」——指令和数据以同等地位存放在存储器中，CPU 按地址顺序取出并解释执行。", "answer": true, "explanation": "冯·诺依曼体系结构的两大要点：一是存储器统一存放指令和数据（不区分二者），二是 CPU 作为指令的解释器，按程序计数器指示的地址依次取指、译码、执行。这正是「存储程序计算机」名称的由来。", "pitfall": "「存储程序」不等于「程序和数据分开存储」——恰恰相反，二者混存在同一存储器中，这正是冯·诺依曼瓶颈的根源。"}, {"type": "tf", "points": 1, "kc_id": "kc6.2", "cognitive_level": "understand", "difficulty": "medium", "question": "可重定位目标文件（.o）中已经包含了程序运行所需的全部绝对地址，因此可以直接加载执行。", "answer": false, "explanation": "可重定位目标文件恰恰不含绝对地址，它使用相对地址和符号引用来表示代码段与数据段之间的关系，正因如此才能在不同内存位置加载——这也是它被称为「可重定位」的原因。绝对地址是在链接阶段由链接器通过重定位填进去的，可执行文件才有完整地址。", "pitfall": "「可重定位」的含义就是「地址还没定下来」，说它含绝对地址正好说反。"}, {"type": "tf", "points": 1, "kc_id": "kc6.5", "cognitive_level": "understand", "difficulty": "medium", "question": "程序头表（Program Header Table）在可重定位目标文件、可执行文件和共享目标文件中都存在。", "answer": false, "explanation": "程序头表只在可执行文件和共享目标文件中存在，可重定位目标文件中没有。因为程序头表描述的是「段如何映射到内存」，而 .o 文件还没有确定的地址布局，谈不上内存映射。.o 文件只有节头表。", "pitfall": "可重定位文件有节头表、没有程序头表。对 .o 执行 readelf -l 会提示 no program headers。"}, {"type": "tf", "points": 1, "kc_id": "kc6.11", "cognitive_level": "understand", "difficulty": "medium", "question": "静态链接生成的可执行文件体积通常比动态链接版本大得多，但对外部库环境的依赖更低。", "answer": true, "explanation": "静态链接在编译时把需要的库代码直接复制进可执行文件，因此体积大（PPT 实例：静态版 727908 字节 vs 动态版 7452 字节，相差近 100 倍），但运行时不依赖外部 .so，部署到其他机器更省心。动态链接则相反：体积小、多程序共享同一份库代码，但依赖库的版本存在。", "pitfall": "静态=大而自足，动态=小而依赖。两者的体积关系不要记反。"}, {"type": "tf", "points": 1, "kc_id": "kc7.6", "cognitive_level": "understand", "difficulty": "medium", "question": "iptables 的 nat 表可以作用于 PREROUTING、INPUT、OUTPUT、POSTROUTING 四条链。", "answer": true, "explanation": "nat 表负责地址转换，可作用于 PREROUTING、INPUT、OUTPUT、POSTROUTING 四条链（PPT 第7讲原文）。注意它与 filter 表（INPUT/FORWARD/OUTPUT 三链）和 raw 表（PREROUTING/OUTPUT 两链）的挂载范围都不同。", "pitfall": "nat 是四链、filter 是三链、raw 是两链、mangle 是五链。"}, {"type": "tf", "points": 1, "kc_id": "kc7.7", "cognitive_level": "apply", "difficulty": "hard", "question": "若 INPUT 链中已存在禁止 192.168.20.0/24 网段的 DROP 规则，此时用 iptables -A INPUT -s 192.168.20.115 -j ACCEPT 追加一条放行规则，则 192.168.20.115 可以正常访问服务器。", "answer": false, "explanation": "iptables 规则自上而下逐条匹配，一旦命中即执行动作并停止后续匹配。-A 是在链尾追加，放行规则会排在 DROP 之后，192.168.20.115 的数据包先被 DROP 规则命中而丢弃，永远走不到后面的 ACCEPT。必须用 -I INPUT 把放行规则插入到链首（或 DROP 规则之前）才有效。", "pitfall": "规则顺序决定结果。放行规则必须用 -I 插到 DROP 之前，用 -A 追加等于没加。"}, {"type": "tf", "points": 1, "kc_id": "kc8.4", "cognitive_level": "understand", "difficulty": "medium", "question": "/etc/passwd 文件中 UID 为 0 的用户只有一个，即 root，这是系统的硬性约束。", "answer": false, "explanation": "系统并不禁止存在多个 UID 为 0 的账号——只要在 /etc/passwd 中新增一行且第三个字段写 0，该账号就拥有超级用户权限。这恰恰是攻击者常用的留后门手法，因此安全审计时要专门检查是否存在非 root 的 UID 0 账号。", "pitfall": "UID 0 = 超级用户权限，但系统不限制 UID 0 账号的数量。多出的 UID 0 账号是后门信号。"}, {"type": "tf", "points": 1, "kc_id": "kc9.4", "cognitive_level": "apply", "difficulty": "hard", "question": "文件的 SUID 位被设置后，任何用户执行该文件时，进程的有效用户 ID（EUID）都会变为该文件属主的 UID。", "answer": true, "explanation": "SUID（Set User ID）的作用正是如此：普通用户执行带 SUID 位的文件时，进程的 EUID 临时切换为文件属主的 UID，运行结束后恢复。若文件属主是 root（如 /usr/bin/passwd），则任何用户执行时都以 root 权限运行其中代码——这也是 SUID 程序一旦存在漏洞就能被用于提权的原因。", "pitfall": "SUID 改的是 EUID（有效用户 ID），不是 RUID（真实用户 ID）。属主为 root 的 SUID 程序是提权重灾区。"}, {"type": "tf", "points": 1, "kc_id": "kc9.2", "cognitive_level": "understand", "difficulty": "medium", "question": "inode 中保存了文件名，因此重命名文件会导致其 inode 号发生变化。", "answer": false, "explanation": "inode 记录文件的权限、属主、时间戳、大小、block 位置等元信息，唯独不记录文件名。文件名保存在目录项中，目录项负责把「名字」映射到「inode 号」。重命名文件只修改目录项，inode 号和文件内容都不变——这也是硬链接能工作的基础。", "pitfall": "inode 不含文件名。改名不改 inode；硬链接让多个名字指向同一 inode。"}, {"type": "tf", "points": 1, "kc_id": "kc11.2", "cognitive_level": "understand", "difficulty": "basic", "question": "HIDS 部署在单台主机上，通过监控文件完整性、系统日志和进程行为来发现入侵迹象；NIDS 部署在网络关键节点，通过分析网段流量发现攻击特征。", "answer": true, "explanation": "这是按部署位置划分的经典分类：HIDS（Host-based IDS）装在单机上，关注主机内部的文件、日志、进程、系统调用等；NIDS（Network-based IDS）部署在网络关键节点，通过抓包分析流量中的攻击特征。两者互补：HIDS 看不到全网流量，NIDS 看不到主机内部状态。", "pitfall": "NIDS 看网络流量、HIDS 看主机行为。别把 N 和 H 的含义搞反。"}, {"type": "comprehensive", "points": 15, "kc_id": "kc5.4", "cognitive_level": "analyze", "difficulty": "hard", "question": "【程序分析题 1】如下所示为 Linux 下运行的某个内嵌汇编代码，请回答后面的问题：<br><pre><code>int main() {\n    unsigned long val1 = 1;\n    unsigned long val2 = 2;\n    unsigned long val3 = 0;\n    printf(\"val1:%ld,val2:%ld,val3:%ld\\n\", val1, val2, val3);\n    asm volatile(\n        \"movq &#36;0,%%rax\\n\\t\"\n        \"addq %1,%%rax\\n\\t\"\n        \"addq %2,%%rax\\n\\t\"\n        \"movq %%rax,%0\\n\\t\"\n        : \"=m\"(val3)\n        : \"g\"(val1), \"g\"(val2));\n    printf(\"val1:%ld+val2:%ld=val3:%ld\\n\", val1, val2, val3);\n    return 0;\n}</code></pre>（1）请写出蓝色部分（四条汇编指令）每一行代码的作用。（8 分）<br>（2）请说明约束符 \"=m\"、\"g\" 各自的含义。（4 分）<br>（3）请给出该段程序最后在控制台打印的内容。（3 分）", "answer": -1, "explanation": "<strong>（1）四条汇编指令的作用（每行 2 分）</strong><br>· <code>movq &#36;0,%%rax</code>：把立即数 0 送入 64 位寄存器 rax，作用是<strong>清零累加器</strong>。注意 <code>%%</code> 是内嵌汇编中的转义写法，编译后对应单个 <code>%rax</code>。<br>· <code>addq %1,%%rax</code>：把第 1 个输入操作数（即 val1）加到 rax 中，<strong>累加 val1</strong>。%1 指代输出操作数之后的第一个输入操作数。<br>· <code>addq %2,%%rax</code>：把第 2 个输入操作数（即 val2）继续累加到 rax，<strong>累加 val2</strong>。<br>· <code>movq %%rax,%0</code>：把 rax 中的累加结果写回第 0 个操作数，即输出操作数 val3，<strong>写回结果</strong>。<br><br><strong>（2）约束符含义（各 2 分）</strong><br>· <code>\"=m\"(val3)</code>：<code>=</code> 表示该操作数是<strong>只写的输出</strong>（汇编执行后它的值被覆盖）；<code>m</code> 表示该操作数位于<strong>内存</strong>（memory），编译器直接把 val3 的内存地址交给汇编代码，不经过寄存器中转。<br>· <code>\"g\"(val1)</code>：<code>g</code> 表示<strong>通用操作数</strong>（general），由编译器根据上下文自由选择放在通用寄存器（r）或内存（m）中，是最灵活的约束。<br><br><strong>（3）控制台打印内容（3 分）</strong><br>程序共两次 printf：<br>第一次（汇编执行前）：<code>val1:1,val2:2,val3:0</code><br>第二次（汇编执行后）：<code>val1:1+val2:2=val3:3</code><br>因为 val3 = 0 + val1 + val2 = 0 + 1 + 2 = 3，而 val1、val2 未被修改。<br><br><strong>评分要点</strong>：（1）每行 2 分，必须说明「清零/累加val1/累加val2/写回」四个语义动作，仅逐字翻译指令助记符不给分；（2）每个约束符 2 分，需分别说明 = 的只写语义与 m/g 的存储位置差异；（3）两行打印各 1.5 分，val3 必须为 3。", "pitfall": "常见错误：把 %%rax 当成两个寄存器；漏看 movq &#36;0 的清零作用而以为 val3 会在原值上累加；把 %0/%1/%2 的操作数序号数错（%0 是输出，%1 起才是输入）；把 \"g\" 误认为只表示寄存器（它也可能落到内存）。"}, {"type": "comprehensive", "points": 15, "kc_id": "kc1.8", "cognitive_level": "analyze", "difficulty": "hard", "question": "【程序分析题 2】如下所示为某段 32 位汇编代码，请完成以下任务：<br><pre><code>g:\n    pushl %ebp\n    movl  %esp, %ebp\n    movl  8(%ebp), %eax\n    addl  $3, %eax\n    popl  %ebp\n    ret\n\nf:\n    pushl %ebp\n    movl  %esp, %ebp\n    subl  $4, %esp\n    movl  8(%ebp), %eax\n    movl  %eax, (%esp)\n    call  g\n    movl  %ebp, %esp\n    popl  %ebp\n    ret\n\nmain:\n    pushl %ebp\n    movl  %esp, %ebp\n    subl  $4, %esp\n    movl  $8, (%esp)\n    call  f\n    addl  $1, %eax\n    movl  %ebp, %esp\n    popl  %ebp\n    ret</code></pre>（1）请在右侧写出三个函数各自对应的 C 语言代码（变量名自行命名，函数名保持 g、f、main）。（9 分）<br>（2）说明为什么取参数使用 8(%ebp) 而不是 4(%ebp)。（3 分）<br>（3）说明 subl $4,%esp 与 movl %eax,(%esp) 这两条指令在传参过程中的配合作用。（3 分）", "answer": -1, "explanation": "<strong>（1）对应的 C 代码（每函数 3 分）</strong><br><pre><code>int g(int x) {\n    return x + 3;\n}\n\nint f(int x) {\n    return g(x);\n}\n\nint main(void) {\n    return f(8) + 1;\n}</code></pre>逐函数推导：<br>· <strong>g</strong>：<code>movl 8(%ebp),%eax</code> 取第一个参数，<code>addl $3,%eax</code> 加 3，<code>ret</code> 返回 eax。故为 <code>return x + 3;</code>。<br>· <strong>f</strong>：<code>subl $4,%esp</code> 预留 4 字节局部空间（用于放传给 g 的实参），<code>movl 8(%ebp),%eax</code> 取自己的参数，<code>movl %eax,(%esp)</code> 把它放到栈顶作为 g 的实参，<code>call g</code> 调用，返回值留在 eax 中直接作为 f 的返回值。故为 <code>return g(x);</code>。<br>· <strong>main</strong>：<code>movl $8,(%esp)</code> 把 8 放到栈顶作为 f 的实参，<code>call f</code> 后 eax 得 f(8)，<code>addl $1,%eax</code> 再加 1。故为 <code>return f(8) + 1;</code>。<br><br><strong>（2）为什么是 8(%ebp)（3 分）</strong><br>调用者的栈布局（从高地址到低地址）依次是：<strong>实参 → 返回地址 → 保存的旧 EBP</strong>。执行 <code>call</code> 时 CPU 自动把返回地址压栈，进入被调函数后第一条 <code>pushl %ebp</code> 又把调用者的 EBP 压栈，随后 <code>movl %esp,%ebp</code> 使 EBP 指向这个保存的旧 EBP。<br>因此：<code>0(%ebp)</code> = 旧 EBP；<code>4(%ebp)</code> = <strong>返回地址</strong>；<code>8(%ebp)</code> = <strong>第一个实参</strong>。若写成 4(%ebp)，取到的将是返回地址而不是参数，程序必然出错。<br><br><strong>（3）两条指令的配合（3 分）</strong><br><code>subl $4,%esp</code> 把栈顶下移 4 字节，<strong>为即将传入的实参预留空间</strong>（相当于「占位」）；<code>movl %eax,(%esp)</code> 把取到的参数值写入这个刚空出的栈顶位置，<strong>完成实参入栈</strong>。二者合起来等价于一次 <code>pushl %eax</code>，但用两条指令实现可以更清楚地控制栈空间（且在某些编译优化下避免 push 的副作用）。之后 <code>call g</code> 时，g 就能通过 <code>8(%ebp)</code> 正常取到这个实参。<br><br><strong>评分要点</strong>：（1）每函数 3 分，函数体逻辑必须正确（g 加 3、f 调 g、main 调 f 后加 1），漏掉 addl $1 或写错调用关系不得分；（2）需明确指出 4(%ebp) 是返回地址、8(%ebp) 才是首个参数（3 分）；（3）需说明「预留空间」与「写入实参」的分工（3 分）。", "pitfall": "常见错误：把 8(%ebp) 写成 4(%ebp)（忘记返回地址占 4 字节）；漏掉 main 里的 addl $1 写成 return f(8)；把 f 里的 subl $4 误认为是局部变量而多声明一个变量；把 subl+movl 的组合误解为局部变量初始化而非实参传递。"}, {"type": "comprehensive", "points": 15, "kc_id": "kc1.7", "cognitive_level": "analyze", "difficulty": "hard", "question": "【程序分析题 3】如下所示为某段 32 位汇编代码，设执行前 ESP = 0x1000，EBP = 0x2000，栈向低地址方向增长，每次 push/pop 操作 4 字节：<br><pre><code>pushl  $8\nmovl   %esp, %ebp\npushl  %ebp\npushl  $8\naddl   $4, %esp\npopl   %ebp</code></pre>（1）请逐条分析每条指令执行后 ESP 的值，并画出执行完毕后的堆栈状态（标明每个单元的地址与内容）。（10 分）<br>（2）标明当前栈顶和栈基的地址位置，并指出二者是否重合。（3 分）<br>（3）说明 addl $4,%esp 执行后，原栈顶单元的数据是否被清除。（2 分）", "answer": -1, "explanation": "<strong>（1）逐条推演与最终堆栈状态（10 分）</strong><br>· 初始：ESP = 0x1000，EBP = 0x2000。<br>· <code>pushl &#36;8</code>：ESP 先减 4 得 <strong>0x0FFC</strong>，再把 8 写入 [0x0FFC]。<br>· <code>movl %esp,%ebp</code>：EBP = ESP = <strong>0x0FFC</strong>（原来的 0x2000 被覆盖）。<br>· <code>pushl %ebp</code>：ESP 减 4 得 <strong>0x0FF8</strong>，把 EBP 的值 0x0FFC 写入 [0x0FF8]。<br>· <code>pushl &#36;8</code>：ESP 减 4 得 <strong>0x0FF4</strong>，把 8 写入 [0x0FF4]。<br>· <code>addl &#36;4,%esp</code>：ESP 加 4 得 <strong>0x0FF8</strong>（栈顶回退一格）。<br>· <code>popl %ebp</code>：先读出 [0x0FF8] 的值 0x0FFC 送入 EBP，再让 ESP 加 4 得 <strong>0x0FFC</strong>。<br><br>最终堆栈状态（地址小的在下方，栈向下增长）：<br><pre><code>地址        内容          说明\n0x0FF4      8             已被 addl &#36;4 移出栈顶范围，数据仍残留\n0x0FF8      0x0FFC        已被 popl 弹出，数据仍残留\n0x0FFC      8             ← 当前栈顶（ESP 指向）\n</code></pre>有效栈范围是 [0x0FFC, 0x1000)。<br><br><strong>（2）栈顶与栈基位置（3 分）</strong><br>· <strong>栈顶 ESP = 0x0FFC</strong>，指向内容 8。<br>· <strong>栈基 EBP = 0x0FFC</strong>（最后一条 popl %ebp 把 [0x0FF8] 中的 0x0FFC 恢复进 EBP）。<br>二者<strong>恰好重合</strong>于 0x0FFC。<br><br><strong>（3）数据是否被清除（2 分）</strong><br><strong>没有被清除</strong>。<code>addl &#36;4,%esp</code> 只修改 ESP 寄存器，使栈顶指针上移 4 字节，并不对内存做任何写操作。[0x0FF4] 中原来的 8 依然存在，只是已不在有效栈范围内——后续若再有 push 操作，该单元才会被新数据覆盖。这也是栈上残留敏感数据（如密码、密钥）可被取证读取的原因。<br><br><strong>评分要点</strong>：（1）每条指令后的 ESP 值各 1.5 分（共 9 分），最终堆栈图 3 个单元的地址与内容各约 0.33 分（共 1 分）；（2）ESP 值 1.5 分、EBP 值 1.5 分，须明确指出重合；（3）必须答「未清除」并解释原因（2 分）。", "pitfall": "三个高频错误：① push 是「先减后写」、pop 是「先读后加」，顺序写反地址全错；② 忘记 movl %esp,%ebp 会覆盖 EBP 的原值 0x2000，仍按 0x2000 作答；③ 误认为 addl &#36;4,%esp 会清零内存，答成「数据被清除」。"}, {"type": "comprehensive", "points": 25, "kc_id": "kc7.8", "cognitive_level": "analyze", "difficulty": "hard", "question": "【综合题】小明大学毕业后进入某互联网公司担任网络管理员，负责维护管理公司基于 Linux 的 Web 服务器。为提高服务器安全防护水平，小明在服务器上配置了 iptables 防火墙。请根据该场景回答下列问题：<br><br>（1）小明在终端输入了什么命令，可以显示 INPUT 链下所有规则（含 policy 与规则序号）？（3 分）<br><br>（2）小明发现 IP 地址 192.168.100.20 向服务器进行了多次端口扫描，想禁止该 IP 对服务器的全部访问，应如何操作？并说明为什么选用 DROP 而非 REJECT。（5 分）<br><br>（3）经过一段时间，发现网段 192.168.20.0/24 内大量 IP 频繁对服务器执行 ping 操作，需要禁止该网段的 ping 请求，但<strong>不能影响该网段其他正常业务</strong>，该如何处理？（5 分）<br><br>（4）公司技术人员恰好在该网段 192.168.20.0/24 内远程调试 Web 应用，需要允许其终端（IP 为 192.168.20.115）访问服务器。请写出命令，并<strong>说明为什么不能用 -A</strong>。（6 分）<br><br>（5）领导怀疑有网络测绘公司频繁对服务器的 UDP 端口扫描，导致 Web 服务出口带宽被挤占，需要对 UDP 流量限速。请写出完整的规则组合。（6 分）", "answer": -1, "explanation": "<strong>（1）显示 INPUT 链规则（3 分）</strong><br><code>iptables -L INPUT -n --line-numbers</code><br>或 <code>iptables -t filter -L INPUT -n --line-numbers</code>。<br>说明：<code>-L</code> 列出规则；<code>-n</code> 以数字形式显示地址与端口（不做反向 DNS 解析，速度快）；<code>--line-numbers</code> 显示规则序号，便于后续用 <code>-D INPUT 序号</code> 精确删除。默认表即 filter，<code>-t filter</code> 可省略。<br><br><strong>（2）禁止单个 IP 全部访问（5 分）</strong><br><code>iptables -A INPUT -s 192.168.100.20 -j DROP</code><br><strong>为什么用 DROP 而非 REJECT</strong>：DROP 静默丢弃数据包，不向源端返回任何响应，攻击者的扫描器只能等到超时，无法判断目标主机是否存在；REJECT 会向源端返回 ICMP 不可达（或 TCP RST），相当于主动告知「这台主机在线且拒绝了你」，反而帮助扫描者确认目标存活、加快后续探测。因此安全防护场景应优先使用 DROP。<br><br><strong>（3）只禁止该网段 ping（5 分）</strong><br><code>iptables -A INPUT -s 192.168.20.0/24 -p icmp -j DROP</code><br><strong>关键点</strong>：必须加 <code>-p icmp</code> 限定协议。若只写 <code>-s 192.168.20.0/24 -j DROP</code>，会连同该网段的 HTTP、SSH、数据库等所有流量一并封掉，造成大面积业务中断。ping 使用 ICMP echo request（类型 8），因此限定 icmp 协议即可精准封禁 ping 而保留其他业务。<br><br><strong>（4）放行网段内单个 IP（6 分）</strong><br><code>iptables -I INPUT -s 192.168.20.115 -j ACCEPT</code><br><strong>为什么不能用 -A</strong>：iptables 规则<strong>自上而下逐条匹配，一旦命中即执行动作并停止后续匹配</strong>。<code>-A</code> 是把规则追加到链<strong>末尾</strong>，而第（3）问已经用 <code>-A</code> 在链尾（更早的位置）放了一条禁止 192.168.20.0/24 的 DROP 规则。若用 <code>-A</code> 追加放行规则，它会排在 DROP 之后，192.168.20.115 的数据包会先被 DROP 命中丢弃，根本走不到后面的 ACCEPT——这条放行规则形同虚设。必须用 <code>-I</code> 把 ACCEPT 插入到链<strong>首部</strong>（或至少插到 DROP 之前，如 <code>-I INPUT 1</code>），才能让它先于 DROP 生效。<br><br><strong>（5）UDP 限速（6 分）</strong><br><code>iptables -A INPUT -p udp -m limit --limit 10/s --limit-burst 20 -j ACCEPT</code><br><code>iptables -A INPUT -p udp -j DROP</code><br><strong>说明</strong>：第一条用 <code>limit</code> 模块做令牌桶限速——允许 UDP 流量以每秒 10 个包的速率通过，突发上限 20 个包；第二条作为兜底，把超出限速被 limit 模块「漏过」的 UDP 包全部丢弃。两条<strong>必须配合使用</strong>：只有 limit 而没有兜底 DROP，超出的包会继续往下走并被默认策略处理；只有 DROP 而没有 limit，则会封死所有 UDP，连正常的 DNS 查询都受影响。<br>若需针对特定端口（如只限制扫描常用的高位端口），可加 <code>--dport</code> 范围限定。<br><br><strong>评分要点</strong>：（1）命令含 -L 与 -n 即给 2 分，含 --line-numbers 再给 1 分；（2）命令 2 分，DROP 与 REJECT 的差异说明 3 分（须点出「不返回响应、不暴露主机存活」）；（3）命令 3 分（缺 -p icmp 只给 1 分），说明「不能影响其他业务」的理由 2 分；（4）命令 3 分（写成 -A 不给分），-I 与 -A 的顺序差异说明 3 分；（5）两条规则各 2 分，说明必须配合使用 2 分。", "pitfall": "本题四个陷阱：① 第（3）问漏写 -p icmp 会误封整个网段所有业务；② 第（4）问用 -A 追加放行规则，因排在 DROP 之后而永远不生效——这是全题最核心的考点；③ 第（2）问误以为 REJECT 更「明确」而选它，实际上会暴露主机存活；④ 第（5）问只写 limit 不写兜底 DROP，限速形同虚设。"}];
var LABELS = {"page_title": "期末考试", "section": {"choice": "一、选择题（5 题 × 2 分 = 10 分）", "fill": "二、填空题（10 空 × 1 分 = 10 分）", "tf": "三、判断题（10 题 × 1 分 = 10 分）", "multi": "四、多选题", "short": "五、简答题", "calc": "六、计算题", "code": "七、代码题", "essay": "八、问答题", "comprehensive": "四、程序分析与综合题（15×3 + 25 = 70 分）"}, "section_order": ["choice", "fill", "tf", "multi", "short", "calc", "code", "essay", "comprehensive"], "points_suffix": "分", "true_label": "正确", "false_label": "错误", "placeholder": "在此作答...", "code_placeholder": "在此编写代码...", "pitfall_prefix": "易错提醒：", "correct_label": "正确", "wrong_label": "错误", "partial_label": "部分正确", "answer_prefix": "正确答案：", "reference_label": "参考答案", "graded_label": "已批改", "grade_button": "提交批改", "score_label": "总分", "duration_prefix": "满分 100 分 | 建议 ", "duration_suffix": " 分钟 | 选择答案后点击提交批改"};
var __epaImages = {}; // { qid: [dataUrl, ...] } — pasted images per answer field

// ─── Answer normalization (robust to how the JSON was authored) ──────
// tf / choice answers may arrive as int index, boolean, letter ("A"),
// or label string ("正确"/"错误"/"对"/"错"). All are coerced to an
// option index so grading never silently fails on a type mismatch.

function tfAnswerIndex(ans) {
  // option 0 = true_label (正确), option 1 = false_label (错误)
  // boolean: true → 正确(0), false → 错误(1)
  if (typeof ans === 'boolean') return ans ? 0 : 1;
  // number: treat as boolean (0=false→错误(1), non-zero=true→正确(0))
  if (typeof ans === 'number') return ans ? 0 : 1;
  var s = ('' + ans).trim().toLowerCase();
  var truthy = ['t', 'true', '正确', '对', '是', 'yes', 'y', '√', '✓'];
  var falsy  = ['f', 'false', '错误', '错', '否', 'no', 'n', '×', 'x'];
  if (truthy.indexOf(s) !== -1) return 0;
  if (falsy.indexOf(s) !== -1) return 1;
  return ans ? 0 : 1;
}

function choiceAnswerIndex(ans, options) {
  if (typeof ans === 'number') return ans;
  var s = ('' + ans).trim();
  if (/^[A-Za-z]$/.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  if (options) {
    for (var i = 0; i < options.length; i++) {
      if (('' + options[i]).trim() === s) return i;
    }
  }
  return parseInt(s, 10);
}

function multiAnswerSet(ans, options) {
  var arr = Array.isArray(ans) ? ans : [ans];
  var set = {};
  for (var i = 0; i < arr.length; i++) {
    set[choiceAnswerIndex(arr[i], options)] = true;
  }
  return set;
}

// Normalize free text for fill-in-the-blank comparison: trim, lowercase,
// drop surrounding whitespace and common punctuation, unify full/half width.
function normText(s) {
  s = ('' + s).trim().toLowerCase();
  s = s.replace(/[\s　]+/g, '');
  s = s.replace(/[.,;:!?。，、；：！？“”"'（）()【】\[\]<>《》]/g, '');
  // full-width ASCII -> half-width
  s = s.replace(/[！-～]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
  });
  return s;
}

// How many blanks does a fill question have? Count underscore / ＿ runs.
function fillBlankCount(question) {
  var m = ('' + question).match(/(_{2,}|＿+)/g);
  return m ? m.length : 0;
}

// Coerce a fill `answer` into an array (one entry per blank) of accepted
// answer lists. Handles: string, [synonyms], [[blank1 syns],[blank2 syns]].
function fillBlankAnswers(ans, nBlanks) {
  if (nBlanks < 1) nBlanks = 1;
  if (!Array.isArray(ans)) return padBlanks([[ans]], nBlanks);
  if (ans.length && Array.isArray(ans[0])) return padBlanks(ans, nBlanks);
  // flat array of strings
  if (nBlanks === 1) return [ans];                 // synonyms for one blank
  if (ans.length === nBlanks) {                    // one answer per blank
    return ans.map(function (a) { return [a]; });
  }
  return padBlanks([ans], nBlanks);                // ambiguous -> all on blank 1
}

function padBlanks(arr, n) {
  var out = arr.slice(0, n);
  while (out.length < n) out.push(['']);
  return out;
}

// ─── Build ───────────────────────────────────────────────────────────

function build() {
  var container = document.getElementById('questions-container');
  if (!container) { console.error('ExamPass: questions-container not found'); return; }

  // Stable-sort questions by section order so headings group correctly
  // regardless of input order.
  var order = LABELS.section_order || [];
  Q.forEach(function (q, i) { q._i = i; });
  Q.sort(function (a, b) {
    var oa = order.indexOf(a.type); if (oa === -1) oa = 99;
    var ob = order.indexOf(b.type); if (ob === -1) ob = 99;
    return oa - ob || a._i - b._i;
  });

  var h = '';
  var sec = '';
  var titles = LABELS.section;

  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    if (q.type !== sec) {
      sec = q.type;
      if (titles[q.type]) h += '<h3>' + titles[q.type] + '</h3>';
    }

    var qid = 'q' + i;
    h += '<div class="q-card" id="card-' + qid + '">';
    h += '<div class="q-num">' + (i + 1) + '. (' + q.points + ' ' + LABELS.points_suffix + ')</div>';

    if (q.type === 'fill') {
      h += '<div class="q-text">' + renderFill(q, qid) + '</div>';
    } else {
      h += '<div class="q-text">' + q.question + '</div>';
    }

    if (q.type === 'choice') {
      var opts = q.options || [];
      for (var j = 0; j < opts.length; j++) {
        h += '<label class="option" id="opt-' + qid + '-' + j + '" onclick="sel(\'' + qid + '\',' + j + ')">';
        h += '<input type="radio" name="' + qid + '" value="' + j + '">' + String.fromCharCode(65 + j) + '. ' + opts[j] + '</label>';
      }
    } else if (q.type === 'multi') {
      var mopts = q.options || [];
      for (var k = 0; k < mopts.length; k++) {
        h += '<label class="option" id="opt-' + qid + '-' + k + '" onclick="toggle(\'' + qid + '\',' + k + ')">';
        h += '<input type="checkbox" name="' + qid + '" value="' + k + '">' + String.fromCharCode(65 + k) + '. ' + mopts[k] + '</label>';
      }
    } else if (q.type === 'tf') {
      h += '<label class="option" id="opt-' + qid + '-0" onclick="sel(\'' + qid + '\',0)">';
      h += '<input type="radio" name="' + qid + '" value="0">' + LABELS.true_label + '</label>';
      h += '<label class="option" id="opt-' + qid + '-1" onclick="sel(\'' + qid + '\',1)">';
      h += '<input type="radio" name="' + qid + '" value="1">' + LABELS.false_label + '</label>';
    } else if (q.type === 'fill') {
      // inputs already rendered inline inside q-text
    } else if (q.type === 'code') {
      h += '<textarea class="q-textarea q-code" id="text-' + qid + '" placeholder="' + (LABELS.code_placeholder || LABELS.placeholder) + '" rows="8" spellcheck="false"></textarea>';
    } else {
      h += '<textarea class="q-textarea" id="text-' + qid + '" placeholder="' + LABELS.placeholder + '" rows="3"></textarea>';
    }

    h += '<div class="result" id="result-' + qid + '">';
    h += '<span class="badge" id="badge-' + qid + '"></span><span id="correct-' + qid + '"></span>';
    h += '<div class="explanation">' + (q.explanation || '') + '</div>';
    if (q.pitfall) {
      h += '<div class="pitfall">' + LABELS.pitfall_prefix + q.pitfall + '</div>';
    }
    h += '</div></div>';
  }

  container.innerHTML = h;
  __epaPasteListeners(container);

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([container]).catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

// Render fill question text with inline <input> boxes replacing blanks.
function renderFill(q, qid) {
  var nBlanks = fillBlankCount(q.question);
  var k = 0;
  var html = ('' + q.question).replace(/(_{2,}|＿+)/g, function () {
    var inp = '<input type="text" class="fill-input" id="fill-' + qid + '-' + k + '" autocomplete="off" spellcheck="false">';
    k++;
    return inp;
  });
  if (k === 0) {
    // No markers in text -> append boxes based on answer shape, one per line
    var n = fillBlankAnswers(q.answer, 1).length;
    var ans = q.answer;
    if (Array.isArray(ans)) n = Array.isArray(ans[0]) ? ans.length : (ans.length || 1);
    if (n < 1) n = 1;
    html += '<div>';
    for (var b = 0; b < n; b++) {
      html += '<div class="fill-blank-row">';
      if (n > 1) html += '<span class="fill-tag">' + (b + 1) + '.</span>';
      html += '<input type="text" class="fill-input" id="fill-' + qid + '-' + b + '" autocomplete="off" spellcheck="false">';
      html += '</div>';
    }
    html += '</div>';
  }
  return html;
}

document.addEventListener('DOMContentLoaded', build);
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  build();
}

// ─── Selection handlers ──────────────────────────────────────────────

function sel(qid, idx) {
  var prefix = 'opt-' + qid + '-';
  var all = document.querySelectorAll('[id^="' + prefix + '"]');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  var target = document.getElementById('opt-' + qid + '-' + idx);
  if (target) target.classList.add('selected');
  var radio = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  if (radio) radio.checked = true;
}

function toggle(qid, idx) {
  var box = document.querySelector('input[name="' + qid + '"][value="' + idx + '"]');
  var label = document.getElementById('opt-' + qid + '-' + idx);
  if (!box) return;
  box.checked = !box.checked;
  if (label) label.classList.toggle('selected', box.checked);
}

// ─── Grading ─────────────────────────────────────────────────────────

function gradeAll() {
  var score = 0;
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var qid = 'q' + i;
    var card = document.getElementById('card-' + qid);
    var result = document.getElementById('result-' + qid);
    var badge = document.getElementById('badge-' + qid);
    var correctEl = document.getElementById('correct-' + qid);
    if (!card || !result) continue;

    result.style.display = 'block';

    if (q.type === 'choice' || q.type === 'tf') {
      score += gradeSingle(q, qid, card, badge, correctEl);
    } else if (q.type === 'multi') {
      score += gradeMulti(q, qid, card, badge, correctEl);
    } else if (q.type === 'fill') {
      score += gradeFill(q, qid, card, badge, correctEl);
    } else {
      card.classList.add('correct');
      badge.className = 'badge badge-ref';
      badge.textContent = LABELS.reference_label;
    }
  }

  var sb = document.getElementById('score-box');
  if (sb) {
    sb.style.display = 'block';
    document.getElementById('score-num').textContent = roundScore(score);
    sb.scrollIntoView({ behavior: 'smooth' });
  }

  var opts = document.querySelectorAll('.option');
  for (var a = 0; a < opts.length; a++) opts[a].style.pointerEvents = 'none';
  var tas = document.querySelectorAll('.q-textarea');
  for (var b = 0; b < tas.length; b++) tas[b].disabled = true;
  var fis = document.querySelectorAll('.fill-input');
  for (var c = 0; c < fis.length; c++) fis[c].disabled = true;

  var btn = document.getElementById('grade-btn');
  if (btn) { btn.disabled = true; btn.textContent = LABELS.graded_label; }

  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(function (err) {
      console.error('MathJax typeset error:', err);
    });
  }
}

function roundScore(s) {
  return Math.round(s * 10) / 10;
}

function gradeSingle(q, qid, card, badge, correctEl) {
  var ansIdx = q.type === 'tf' ? tfAnswerIndex(q.answer) : choiceAnswerIndex(q.answer, q.options);
  var radio = document.querySelector('input[name="' + qid + '"]:checked');
  if (radio && parseInt(radio.value, 10) === ansIdx) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
    var ok = document.getElementById('opt-' + qid + '-' + ansIdx);
    if (ok) ok.classList.add('correct-answer');
    return q.points;
  }
  card.classList.add('wrong');
  badge.className = 'badge badge-no';
  badge.textContent = LABELS.wrong_label;
  var ansText = q.type === 'choice'
    ? String.fromCharCode(65 + ansIdx) + '. ' + (q.options ? q.options[ansIdx] : '')
    : (ansIdx === 0 ? LABELS.true_label : LABELS.false_label);
  correctEl.innerHTML = LABELS.answer_prefix + ansText;
  if (radio) {
    var wrongOpt = document.getElementById('opt-' + qid + '-' + radio.value);
    if (wrongOpt) wrongOpt.classList.add('wrong-answer');
  }
  var corr = document.getElementById('opt-' + qid + '-' + ansIdx);
  if (corr) corr.classList.add('correct-answer');
  return 0;
}

function gradeMulti(q, qid, card, badge, correctEl) {
  var want = multiAnswerSet(q.answer, q.options);
  var wantKeys = Object.keys(want).map(Number);
  var checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
  var picked = [];
  for (var i = 0; i < checked.length; i++) picked.push(parseInt(checked[i].value, 10));

  var anyWrong = false, hitCorrect = 0;
  for (var p = 0; p < picked.length; p++) {
    if (want[picked[p]]) hitCorrect++;
    else anyWrong = true;
  }

  // reveal correct / wrong option markers
  var mopts = q.options || [];
  for (var j = 0; j < mopts.length; j++) {
    var el = document.getElementById('opt-' + qid + '-' + j);
    if (!el) continue;
    if (want[j]) el.classList.add('correct-answer');
    else if (picked.indexOf(j) !== -1) el.classList.add('wrong-answer');
  }

  var earned;
  if (!anyWrong && hitCorrect === wantKeys.length && picked.length === wantKeys.length) {
    earned = q.points;
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
    correctEl.innerHTML = '';
  } else if (!anyWrong && hitCorrect > 0) {
    // 少选不错选 -> partial credit
    earned = roundScore(q.points * hitCorrect / wantKeys.length);
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  } else {
    earned = 0;
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
    correctEl.innerHTML = LABELS.answer_prefix + multiAnswerText(wantKeys, mopts);
  }
  return earned;
}

function multiAnswerText(keys, options) {
  return keys.sort(function (a, b) { return a - b; }).map(function (k) {
    return String.fromCharCode(65 + k) + '. ' + (options ? options[k] : '');
  }).join('  ');
}

// ─── Image paste support ─────────────────────────────────────────────

function __epaPasteListeners(container) {
  var tas = container.querySelectorAll('.q-textarea');
  for (var i = 0; i < tas.length; i++) {
    (function(ta) {
      var qid = ta.id.replace('text-', '');
      ta.addEventListener('paste', function(e) {
        var items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (var j = 0; j < items.length; j++) {
          if (items[j].type.indexOf('image') !== -1) {
            e.preventDefault();
            var file = items[j].getAsFile();
            var reader = new FileReader();
            reader.onload = (function(id, anchor) {
              return function(ev) {
                var dataUrl = ev.target.result;
                if (!__epaImages[id]) __epaImages[id] = [];
                __epaImages[id].push(dataUrl);

                var wrap = document.createElement('div');
                wrap.className = 'paste-img-wrap';
                var img = document.createElement('img');
                img.src = dataUrl;
                var rm = document.createElement('button');
                rm.className = 'paste-img-remove';
                rm.title = '移除图片';
                rm.textContent = '×';
                rm.onclick = (function(url, w) {
                  return function() {
                    var idx = __epaImages[id].indexOf(url);
                    if (idx !== -1) __epaImages[id].splice(idx, 1);
                    w.parentNode.removeChild(w);
                  };
                })(dataUrl, wrap);
                wrap.appendChild(img);
                wrap.appendChild(rm);
                anchor.parentNode.insertBefore(wrap, anchor.nextSibling);
              };
            })(qid, ta);
            reader.readAsDataURL(file);
          }
        }
      });
    })(tas[i]);
  }
}

// ─── Collect all user answers for export ─────────────────────────────

function collectAnswers() {
  var out = [];
  for (var i = 0; i < Q.length; i++) {
    var q = Q[i];
    var qid = 'q' + i;
    var userAnswer = null;

    if (q.type === 'choice' || q.type === 'tf') {
      var radio = document.querySelector('input[name="' + qid + '"]:checked');
      userAnswer = radio ? parseInt(radio.value, 10) : null;
    } else if (q.type === 'multi') {
      var checked = document.querySelectorAll('input[name="' + qid + '"]:checked');
      userAnswer = [];
      for (var c = 0; c < checked.length; c++) {
        userAnswer.push(parseInt(checked[c].value, 10));
      }
    } else if (q.type === 'fill') {
      var nBlanks = fillBlankCount(q.question);
      var blanks = fillBlankAnswers(q.answer, nBlanks);
      userAnswer = [];
      for (var b = 0; b < blanks.length; b++) {
        var inp = document.getElementById('fill-' + qid + '-' + b);
        userAnswer.push(inp ? inp.value : '');
      }
    } else {
      var ta = document.getElementById('text-' + qid);
      userAnswer = ta ? ta.value : '';
    }

    out.push({
      index: i,
      type: q.type,
      question: q.question,
      options: q.options || null,
      correct_answer: q.answer,
      user_answer: userAnswer,
      points: q.points,
      explanation: q.explanation || '',
      kc_id: q.kc_id || '',
      images: (__epaImages[qid] || []).slice()
    });
  }
  return out;
}

// ─── Save answers for AI grading ─────────────────────────────────────

function saveForGrading() {
  var answers = collectAnswers();
  var chapterTitle = (document.title || '章节').replace(/\s+/g, '_');
  var nowStr = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  var filename = chapterTitle + '_answers_' + nowStr + '.json';

  var data = JSON.stringify({
    chapter: document.title || '',
    saved_at: new Date().toISOString(),
    questions: answers
  }, null, 2);

  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  var cmdEl = document.getElementById('epa-grade-cmd-text');
  if (cmdEl) cmdEl.textContent = '/exampass grade "<下载目录>/' + filename + '"';
  var modal = document.getElementById('epa-grade-modal');
  if (modal) modal.classList.add('open');
}

function __epaCloseGradeModal() {
  var modal = document.getElementById('epa-grade-modal');
  if (modal) modal.classList.remove('open');
}

function __epaCopyGradeCmd() {
  var cmdEl = document.getElementById('epa-grade-cmd-text');
  if (!cmdEl) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(cmdEl.textContent);
  } else {
    var range = document.createRange();
    range.selectNodeContents(cmdEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }
  var btn = document.getElementById('epa-grade-copy-btn');
  if (btn) { btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = '复制命令'; }, 2000); }
}

function gradeFill(q, qid, card, badge, correctEl) {
  var nBlanks = fillBlankCount(q.question);
  var blanks = fillBlankAnswers(q.answer, nBlanks);
  var n = blanks.length;
  var hit = 0;
  var displays = [];

  for (var b = 0; b < n; b++) {
    var inp = document.getElementById('fill-' + qid + '-' + b);
    var accepted = blanks[b] || [''];
    var user = inp ? normText(inp.value) : '';
    var ok = false;
    for (var a = 0; a < accepted.length; a++) {
      if (accepted[a] !== '' && normText(accepted[a]) === user && user !== '') { ok = true; break; }
    }
    if (inp) inp.classList.add(ok ? 'fill-ok' : 'fill-no');
    if (ok) hit++;
    displays.push((n > 1 ? (b + 1) + '. ' : '') + accepted.filter(function (x) { return x !== ''; }).join(' / '));
  }

  var earned = roundScore(q.points * hit / n);
  correctEl.innerHTML = LABELS.answer_prefix + displays.join('   ');

  if (hit === n) {
    card.classList.add('correct');
    badge.className = 'badge badge-ok';
    badge.textContent = LABELS.correct_label;
  } else if (hit > 0) {
    card.classList.add('partial');
    badge.className = 'badge badge-partial';
    badge.textContent = LABELS.partial_label;
  } else {
    card.classList.add('wrong');
    badge.className = 'badge badge-no';
    badge.textContent = LABELS.wrong_label;
  }
  return earned;
}
